services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:release
    ports:
      - 3004:3000
    volumes:
      - ./data:/data:z
    environment:
      - NEXTAUTH_SECRET=JAl/SWnKwZedD6Z4p5l0oOEkzrvLpEfoSrNWmnbOoic=
      - NEXTAUTH_URL=http://100.114.98.51:3004
      - DATA_DIR=/data
      - OLLAMA_BASE_URL=http://100.114.98.51:11434
      - INFERENCE_TEXT_MODEL=gemma3:4b
      - INFERENCE_ENABLE_AUTO_TAGGING=true
      - INFERENCE_JOB_TIMEOUT_SEC=180
